name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Lint format check
        run: ruff format --check .

      - name: Test with a pinned signing secret
        run: python -m unittest discover -s tests -t . -v
        env:
          MCP_SIGNING_SECRET: ci-fixed-secret

  # The suite must also pass on the ephemeral-secret path, since that is what a
  # developer without configuration actually gets.
  test-ephemeral-secret:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with no signing secret configured
        run: python -m unittest discover -s tests -t . -v

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs and imports in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import proactive_agent_mcp; print(proactive_agent_mcp.__version__)"

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t proactive-agent-mcp:ci .

      - name: Smoke test the entrypoint
        run: |
          set -euo pipefail
          # Initialize over stdio, then close. A healthy server exits 0.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | docker run --rm -i -e MCP_SIGNING_SECRET=ci-secret proactive-agent-mcp:ci \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['result']['serverInfo']['name']=='proactive-agent-mcp', r; print('container handshake ok')"
