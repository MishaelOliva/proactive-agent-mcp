[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-agent-mcp"
version = "1.1.0"
description = "Model Context Protocol server for proactive task triage, document compliance evaluation, and server-enforced agent guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mishael Oliva", email = "mishael.oliva2002@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "compliance",
    "guardrails",
    "json-rpc",
    "hitl"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.4.0"
]

[project.scripts]
proactive-agent-mcp = "proactive_agent_mcp.server:main"

[project.urls]
Homepage = "https://github.com/MishaelOliva/proactive-agent-mcp"
Repository = "https://github.com/MishaelOliva/proactive-agent-mcp"
Issues = "https://github.com/MishaelOliva/proactive-agent-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["proactive_agent_mcp*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "deploy"
]

[tool.ruff.lint]
# E/F/W: pycodestyle, pyflakes, warnings
# I:   import sorting
# B:   bugbear, which catches the zip-without-strict and bare-raise-in-except
#      classes of defect
# UP:  pyupgrade. Typing.Dict -> dict is skipped because this package still
#      supports Python 3.10, where the PEP 585 builtin generics are fine but
#      keeping typing.Dict is a deliberate readability choice in a codebase
#      that is largely annotation-driven.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules import fixtures before the package under test and reach into
# private module state on purpose, to assert on internals.
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
