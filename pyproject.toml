[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-agent-mcp"
version = "1.0.0"
description = "Autonomous Proactive Agent & Document Intelligence MCP (Model Context Protocol) Server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mishael Oliva", email = "mishaeloliva.work@gmail.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "agentic-ai",
    "autonomous-agents",
    "openclaw",
    "rag",
    "fastapi",
    "compliance",
    "guardrails"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
proactive-agent-mcp = "proactive_agent_mcp.server:main"

[project.urls]
Homepage = "https://github.com/MishaelOliva/proactive-agent-mcp"
Repository = "https://github.com/MishaelOliva/proactive-agent-mcp"
